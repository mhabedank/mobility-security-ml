# Lab inventory: every physical board on the bench.
#
#   hilbench discover --probe     lists connected boards and prints entries for this file
#   hilbench run                  runs the HIL suite on all enabled + connected boards
#
# How a board is found (pick the most stable option you have):
#   port: /dev/serial/by-id/usb-...   explicit device (or rfc2217://host:port for remote boards)
#   match: {serial_number: "..."}     USB serial number (FTDI, CP210x, native USB chips)
#   match: {location: "1-1.4"}        physical USB port - use this for CH340 clones that
#                                     have no unique serial number; never move the cable then
#   match: {vid_pid: "1a86:7523"}     only OK if it is the only such adapter on the host
#
# Optional per board: power (uhubctl / command), reset, flasher, flasher_options,
# baud, tags, enabled, env (simulator fault injection).

lab:
  name: tinyml-hil
  results_dir: ../results     # relative to this file
  build_dir: ../build/fw
  # lock_dir: /var/lock/hilbench   # share between CI runners and humans on the same host

boards:
  # Always available: the firmware compiled for the PC. Lets you develop tests
  # and run CI without hardware.
  - id: sim
    target: native
    tags: [sim, ci]

  - id: sim-noisy
    target: native
    tags: [sim]
    env: {HIL_SIM_BOOT_NOISE: "1"}   # bootloader garbage before the banner, like a real ESP8266
    enabled: false

  # The ESP8266MOD (ESP-12E/F on a NodeMCU / D1 mini style board with CH340 or CP2102).
  # Replace the match with what `hilbench discover` prints for your board.
  - id: esp8266-1
    target: esp8266
    match: {vid_pid: "1a86:7523"}
    tags: [esp, xtensa]

