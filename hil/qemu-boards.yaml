# Virtual boards: real ESP32 firmware running in Espressif's QEMU.
# ESP32-S3 / ESP32-C3 entries are disabled: they need firmware built on ESP-IDF >= 5
# (arduino-esp32 3.x); with the default 2.x core (IDF 4.4) the emulated flash
# fails to initialise ("assert failed: do_core_init startup.c:328"). Real
# hardware is not affected.
# Used by CI (job "esp32 in QEMU") and handy for local development:
#   hilbench --boards hil/qemu-boards.yaml run -b esp32-qemu
# Needs qemu-system-xtensa / qemu-system-riscv32 from
# https://github.com/espressif/qemu/releases on PATH (see hilbench/qemu.py).
lab:
  name: qemu
  results_dir: ../results
  build_dir: ../build/fw

boards:
  - id: esp32-qemu
    target: esp32
    port: socket://127.0.0.1:5555
    reset: soft
    flasher: command
    flasher_options: {command: "{python} -m hilbench.qemu start {dir} --port 5555", timeout_s: 120}
    power: {type: command, on: "true", off: "{python} -m hilbench.qemu stop --port 5555"}
    tags: [qemu]

  - id: esp32c3-qemu
    target: esp32c3
    enabled: false
    port: socket://127.0.0.1:5556
    reset: soft
    flasher: command
    flasher_options: {command: "{python} -m hilbench.qemu start {dir} --port 5556", timeout_s: 120}
    power: {type: command, on: "true", off: "{python} -m hilbench.qemu stop --port 5556"}
    tags: [qemu]

  - id: esp32s3-qemu
    target: esp32s3
    enabled: false
    port: socket://127.0.0.1:5557
    reset: soft
    flasher: command
    flasher_options: {command: "{python} -m hilbench.qemu start {dir} --port 5557", timeout_s: 120}
    power: {type: command, on: "true", off: "{python} -m hilbench.qemu stop --port 5557"}
    tags: [qemu]
