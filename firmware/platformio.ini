; HIL bench firmware - one PlatformIO environment per supported SoC/board.
;
; The env name is what hil/targets.yaml refers to as `pio_env`.
; Build all:   pio run -d firmware
; Build one:   pio run -d firmware -e esp8266
; Via bench:   hilbench build --target esp8266
;
; Adding another board: copy an env, adjust platform/board, set HIL_TARGET and
; add a matching entry in hil/targets.yaml. Models that do not fit can be
; dropped with -D MI_EXCLUDE_<MODEL_NAME_UPPER>.

[platformio]
default_envs = esp8266, esp32

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -D HIL_SERIAL_BAUD=115200
extra_scripts =
    pre:scripts/hil_build_id.py
    post:scripts/hil_manifest.py

; --- Espressif -------------------------------------------------------------

; ESP8266MOD / ESP-12E/F (NodeMCU v2/v3, Wemos D1 mini, bare module + USB-UART)
[env:esp8266]
platform = espressif8266
board = nodemcuv2
board_build.f_cpu = 80000000L
upload_speed = 460800
build_flags = ${env.build_flags} -D HIL_TARGET=\"esp8266\"

; same chip clocked at 160 MHz (benchmark comparison)
[env:esp8266_160mhz]
extends = env:esp8266
board_build.f_cpu = 160000000L
build_flags = ${env.build_flags} -D HIL_TARGET=\"esp8266_160mhz\"

[env:esp32]
platform = espressif32
board = esp32dev
upload_speed = 921600
build_flags = ${env.build_flags} -D HIL_TARGET=\"esp32\"

; ESP32-S3-DevKitC-1, connected via the "UART" USB port
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
upload_speed = 921600
build_flags = ${env.build_flags} -D HIL_TARGET=\"esp32s3\" -D ARDUINO_USB_CDC_ON_BOOT=0

; ESP32-S3 connected via the native USB port (USB-Serial/JTAG)
[env:esp32s3_usb]
extends = env:esp32s3
build_flags = ${env.build_flags} -D HIL_TARGET=\"esp32s3_usb\" -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

; ESP32-C3-DevKitM-1 (UART bridge)
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -D HIL_TARGET=\"esp32c3\" -D ARDUINO_USB_CDC_ON_BOOT=0

; ESP32-C3 boards with native USB only (e.g. "SuperMini")
[env:esp32c3_usb]
extends = env:esp32c3
build_flags = ${env.build_flags} -D HIL_TARGET=\"esp32c3_usb\" -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

; --- Raspberry Pi -------------------------------------------------------------

[env:rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
board_build.core = earlephilhower
build_flags = ${env.build_flags} -D HIL_TARGET=\"rp2040\"

[env:rp2350]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
board_build.core = earlephilhower
build_flags = ${env.build_flags} -D HIL_TARGET=\"rp2350\"

; --- ST / Nordic ----------------------------------------------------------------

; NUCLEO-F446RE (Cortex-M4F @180 MHz), serial via ST-LINK VCP
[env:stm32f446]
platform = ststm32
board = nucleo_f446re
upload_protocol = stlink
build_flags = ${env.build_flags} -D HIL_TARGET=\"stm32f446\"

; Arduino Nano 33 BLE / BLE Sense (nRF52840, Cortex-M4F @64 MHz)
[env:nrf52840]
platform = nordicnrf52
board = nano33ble
build_flags = ${env.build_flags} -D HIL_TARGET=\"nrf52840\"
