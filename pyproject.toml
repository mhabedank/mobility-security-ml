[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hilbench"
version = "0.1.0"
description = "Hardware-in-the-loop test bench for TinyML on ESP8266, ESP32, RP2040, STM32, nRF52 and more"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "pyserial>=3.5",
    "pyyaml>=6",
    "pytest>=7.4",
]

[project.optional-dependencies]
hw = ["esptool>=4.7", "platformio>=6.1", "pytest-xdist>=3.3"]
tflite = ["tflite>=2.10"]
dev = ["pytest-xdist>=3.3", "ruff>=0.4"]

[project.scripts]
hilbench = "hilbench.cli:main"

[tool.setuptools.packages.find]
include = ["hilbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hil: needs a device under test",
    "slow: long running",
    "destructive: resets or power-cycles the board",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B011", "E741"]
