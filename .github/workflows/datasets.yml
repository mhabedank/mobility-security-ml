# Dataset compliance + inspection. Data is downloaded on the runner only.
name: datasets

on:
  push:
    paths: ["hilbench/data/**", ".github/workflows/datasets.yml"]
  workflow_dispatch:

jobs:
  verify-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: license declared by publisher == registry
        run: hilbench data verify
      - name: remote files
        run: |
          hilbench data files road can-mirgu uci-har speech-commands dcase2020-t2
          curl -s https://zenodo.org/api/records/3384388 | python -c "import json,sys; [print('mimii', f['key'], f['size']) for f in json.load(sys.stdin)['files']]"
          curl -s https://zenodo.org/api/records/3678171 | python -c "import json,sys; d=json.load(sys.stdin); print(d['metadata'].get('license')); [print('dcase', f['key'], f['size']) for f in d['files']]"
          curl -s "https://archive.ics.uci.edu/api/dataset?id=1035" | python -c "import json,sys; d=json.load(sys.stdin)['data']; print({k: (str(v)[:120]) for k, v in d.items()})"

  inspect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dataset: [road, can-mirgu, uci-har, dcase2020-t2]
    env:
      HILBENCH_DATA: ${{ github.workspace }}/../hbdata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: sudo apt-get install -y -qq p7zip-full unzip > /dev/null
      - run: hilbench data download ${{ matrix.dataset }}
      - run: hilbench data tree ${{ matrix.dataset }} --max 150
      - name: sample content
        run: |
          cat "$HILBENCH_DATA/${{ matrix.dataset }}/SOURCE.json"
          find "$HILBENCH_DATA/${{ matrix.dataset }}/extracted" -type f \( -name '*.log' -o -name '*.csv' -o -name '*.txt' -o -name '*.json' -o -name '*.md' \) | head -12 | while read f; do
            echo "===== $f ($(wc -l < "$f") lines)"; head -n 6 "$f" | cut -c1-400; done
