# Dataset compliance + inspection. Data is downloaded on the runner only.
name: datasets

on:
  push:
    paths: ["hilbench/data/**", ".github/workflows/datasets.yml"]
  workflow_dispatch:

jobs:
  verify-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: license declared by publisher == registry
        run: hilbench data verify
      - name: remote files
        run: |
          hilbench data files road can-mirgu uci-har speech-commands
          curl -s https://zenodo.org/api/records/3384388 | python -c "import json,sys; [print('mimii', f['key'], f['size']) for f in json.load(sys.stdin)['files']]"
          curl -s https://zenodo.org/api/records/3678171 | python -c "import json,sys; d=json.load(sys.stdin); print(d['metadata'].get('license')); [print('dcase', f['key'], f['size']) for f in d['files']]"
          curl -s "https://archive.ics.uci.edu/api/dataset?id=1035" | python -c "import json,sys; d=json.load(sys.stdin)['data']; print({k: (str(v)[:120]) for k, v in d.items()})"

  inspect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dataset: [road, can-mirgu, uci-har]
    env:
      HILBENCH_DATA: ${{ github.workspace }}/../hbdata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: sudo apt-get install -y -qq p7zip-full unzip > /dev/null
      - run: hilbench data download ${{ matrix.dataset }}
      - name: archive listing
        run: |
          for z in "$HILBENCH_DATA/${{ matrix.dataset }}"/raw/*; do ls -la "$z"; file "$z"; xxd -l 96 "$z"; xxd -s 22 -l 64 "$z"; 7z l "$z" | head -40; done
      - run: hilbench data tree ${{ matrix.dataset }} --max 150
      - name: sample content
        run: |
          D="$HILBENCH_DATA/${{ matrix.dataset }}/extracted"
          find "$D" -name capture_metadata.json -o -name metadata.json -o -name readme.md -o -name README* | grep -v __MACOSX | while read f; do
            echo "===== $f"; head -c 6000 "$f"; echo; done
          find "$D" -type f \( -name '*.log' -o -name '*.csv' -o -name '*.txt' \) | grep -v __MACOSX | sort | head -8 | while read f; do
            echo "===== $f ($(wc -l < "$f") lines)"; head -n 5 "$f" | cut -c1-300; done
