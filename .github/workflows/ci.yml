name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run ruff check src models tests
      - run: uv run pytest -q

  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detector matches the recorded host scores
        run: |
          D=models/can-ids-tiny/c
          cat > /tmp/check.c <<'SRC'
          #include <stdio.h>
          #include "can_ids_tiny.h"
          #include "test_vectors.h"
          int main(void) {
              static can_ids_tiny_t ids;
              can_ids_tiny_init(&ids);
              int mismatches = 0;
              for (int i = 0; i < TV_N_FRAMES; i++) {
                  const tv_frame_t *f = &tv_frames[i];
                  float s = can_ids_tiny_score(&ids, f->ts_us, f->can_id, f->dlc, f->data);
                  mismatches += (s != tv_expected_score[i]);
              }
              printf("score mismatches: %d / %d\n", mismatches, TV_N_FRAMES);
              return mismatches != 0;
          }
          SRC
          gcc -std=c99 -O2 -ffp-contract=off -Wall -Wextra -Werror -Wno-unused-parameter \
            -I $D -I $D/generated -I firmware/components/msml_can_features/include \
            /tmp/check.c $D/can_ids_tiny.c firmware/components/msml_can_features/msml_can_features.c \
            -o /tmp/check
          /tmp/check
