# Runs the HIL suite on real boards. Needs a self-hosted runner on the machine
# the boards are plugged into, registered with the label "hil" (docs/ci.md).
name: hil

on:
  workflow_dispatch:
    inputs:
      boards:
        description: "board ids (space separated, empty = all connected)"
        required: false
        default: ""
      quick:
        description: "smoke run"
        type: boolean
        default: false
  schedule:
    - cron: "17 2 * * *"   # nightly

concurrency:
  group: hil-bench          # one run at a time on the physical bench
  cancel-in-progress: false

jobs:
  hil:
    runs-on: [self-hosted, hil]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -e ".[hw]"
      - name: Inventory
        run: .venv/bin/hilbench list
      - name: Build, flash and test
        run: |
          ARGS="--parallel --slow --results results/hil --junit results/hil/junit.xml"
          for b in ${{ github.event.inputs.boards }}; do ARGS="$ARGS -b $b"; done
          if [ "${{ github.event.inputs.quick }}" = "true" ]; then ARGS="$ARGS --quick"; fi
          if [ -f hil/baseline.json ]; then ARGS="$ARGS --baseline hil/baseline.json"; fi
          .venv/bin/hilbench run $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hil-results
          path: results/hil
