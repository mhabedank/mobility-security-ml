# Publish the model zoo to the Hugging Face Hub.
# Needs the repository secret HF_TOKEN (write token) and optionally the
# repository variable HF_ORG (defaults to the token's user).
name: hub

on:
  push:
    paths: ["models/hub-release.json"]   # release-as-code: version + ref in that file
  workflow_dispatch:
    inputs:
      version:
        description: "zoo version to publish (models whose meta.version matches; synthetic = 0.1.0)"
        required: true
        default: "0.1.0"
      org:
        description: "HF organisation/user (empty = vars.HF_ORG or token owner)"
        required: false
        default: ""
      ref:
        description: "git commit/branch whose models/zoo is published (empty = this branch)"
        required: false
        default: ""
      public:
        description: "create public repos"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
      - name: release parameters
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r = json.load(open("tooling/models/hub-release.json"))
          print(f"version={r['version']}"); print(f"ref={r.get('ref', '')}")
          print(f"public={'false' if r.get('private', True) else 'true'}")
          print("exclude=" + " ".join(f"--exclude {m}" for m in r.get("exclude", [])))
          PY
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
            echo "public=${{ inputs.public }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.rel.outputs.ref || github.sha }}
          path: release
      # models come from `ref`, the publishing code from the triggering commit
      - run: rm -rf release/hilbench && cp -r tooling/hilbench tooling/pyproject.toml release/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[hub]"
        working-directory: release
      - name: render model cards (dry run)
        working-directory: release
        run: hilbench hub publish --version "${{ steps.rel.outputs.version }}" --org "${ORG:-preview}" ${{ steps.rel.outputs.exclude }} --dry-run --out ../hub-stage
        env:
          ORG: ${{ inputs.org || vars.HF_ORG }}
      - uses: actions/upload-artifact@v4
        with:
          name: hub-stage-${{ steps.rel.outputs.version }}
          path: hub-stage
      - name: publish
        working-directory: release
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ORG: ${{ inputs.org || vars.HF_ORG }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::repository secret HF_TOKEN is not set - dry run only (model cards in the hub-stage artifact)"
            exit 0
          fi
          ARGS="--version ${{ steps.rel.outputs.version }} ${{ steps.rel.outputs.exclude }}"
          [ -n "$ORG" ] && ARGS="$ARGS --org $ORG"
          [ "${{ steps.rel.outputs.public }}" = "true" ] && ARGS="$ARGS --public"
          hilbench hub publish $ARGS
